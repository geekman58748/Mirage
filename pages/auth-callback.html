<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mirage — Authenticating...</title>
<style>
  body{background:#07080e;color:#f1f3f9;font-family:Inter,sans-serif;display:flex;
       align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .box{text-align:center;}
  .spinner{width:40px;height:40px;border:2px solid rgba(255,255,255,0.1);
           border-top-color:#4f9fff;border-radius:50%;
           animation:spin .8s linear infinite;margin:0 auto 20px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{margin-top:16px;font-size:13px;color:#ff5f57;max-width:320px;}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div style="font-size:15px;font-weight:600;">Completing sign-in...</div>
  <div style="font-size:13px;color:#8c8f9f;margin-top:6px;">You'll be redirected in a moment</div>
  <div class="err" id="err" style="display:none"></div>
</div>
<script>
(function(){
  var APP_ID   = 'cms56lvu500030ckz9hxe7lex';
  var BASE     = 'https://auth.privy.io/api/v1';
  var HEADERS  = { 'Content-Type': 'application/json', 'privy-app-id': APP_ID };

  var params   = new URLSearchParams(window.location.search);
  var code     = params.get('code');
  var state    = params.get('state');
  var provider = localStorage.getItem('privy_oauth_provider') || 'google';

  if (!code) {
    window.location.replace('../index.html');
    return;
  }

  fetch(BASE + '/oauth/authenticate', {
    method: 'POST',
    headers: HEADERS,
    body: JSON.stringify({ code: code, state: state, provider: provider })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (d.token || d.user) {
      if (d.token) localStorage.setItem('privy_token', d.token);
      localStorage.removeItem('privy_oauth_provider');
      window.location.replace('dashboard.html');
    } else {
      document.getElementById('spinner').style.display = 'none';
      var el = document.getElementById('err');
      el.textContent = d.message || d.error || 'Sign-in failed. Redirecting...';
      el.style.display = 'block';
      setTimeout(function(){ window.location.replace('dashboard.html'); }, 2000);
    }
  })
  .catch(function(e){
    document.getElementById('spinner').style.display = 'none';
    var el = document.getElementById('err');
    el.textContent = 'Network error: ' + e.message;
    el.style.display = 'block';
    setTimeout(function(){ window.location.replace('dashboard.html'); }, 2000);
  });
})();
</script>
</body>
</html>
